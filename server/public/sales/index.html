<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>車行業務行動端</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",system-ui,-apple-system,sans-serif;background:#f3f6fb;color:#111827}button,input{font:inherit}.hidden{display:none!important}.wrap{max-width:920px;margin:auto;padding:16px}.login{min-height:100vh;display:flex;align-items:center;background:linear-gradient(145deg,#111827,#1f2937)}.login .card{width:100%;max-width:460px;margin:auto}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 28px #00000012}.brand{font-size:28px;font-weight:900;margin-bottom:4px}.muted{color:#64748b;font-size:13px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}.btn{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:800}.primary{background:#111827;color:#fff}.full{width:100%}.ghost{background:#e8edf4;color:#111827}.dangerBtn{background:#fee2e2;color:#991b1b}.top{position:sticky;top:0;z-index:5;background:#f3f6fbdd;backdrop-filter:blur(10px);padding:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534;white-space:nowrap}.badge.off{background:#fee2e2;color:#991b1b}.search{margin:10px 0}.car{border:1px solid #e2e8f0;border-radius:15px;padding:14px;margin:10px 0;background:#fff}.carhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.plate{font-size:18px;font-weight:900}.price{font-size:21px;font-weight:900;margin:8px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:88px;height:66px;object-fit:cover;border-radius:10px;border:1px solid #e2e8f0;cursor:pointer}.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr 92px;gap:8px;background:#f3f6fb;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}.tabs button{border:0;border-radius:12px;padding:12px;background:#e2e8f0;font-weight:800}.tabs button.active{background:#111827;color:#fff}.status{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.rejected{background:#fee2e2;color:#991b1b}.notice{padding:11px;border-radius:11px;margin:10px 0;background:#eff6ff;color:#1e40af}.error{background:#fef2f2;color:#991b1b}.modalBg{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:30;padding:0}.modalBg.show{display:flex}.modal{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.modal h2{margin-top:0}.imageBg{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:40;padding:20px}.imageBg.show{display:grid}.imageBg img{max-width:100%;max-height:92vh;border-radius:10px}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi>div{background:#f8fafc;border-radius:12px;padding:10px}.big{font-size:20px;font-weight:900}@media(min-width:760px){.modalBg{align-items:center;padding:20px}.modal{border-radius:20px}.cardsGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.car{margin:0}}
</style></head><body>
<div id="loginPage" class="login"><div class="wrap"><div class="card"><div class="brand">🚗 車行業務行動端</div><div class="muted">帳號由車行後台建立。登入與資料同步都走中央伺服器。</div><div class="field"><label>車行代碼</label><input id="companyCode" autocomplete="organization" placeholder="例如 TEST001"></div><div class="field"><label>業務帳號</label><input id="username" autocomplete="username" placeholder="例如 sales1"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary full" onclick="doLogin()">登入</button><div id="netState" class="notice">正在檢查中央伺服器…</div></div></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div><b id="who"></b><div class="muted" id="shop"></div></div><span id="cloud" class="badge">☁ 已連線</span></div><div id="page"></div><div class="tabs"><button id="tabCars" onclick="showPage('cars')">🚙 庫存</button><button id="tabReq" onclick="showPage('requests')">📝 我的申請</button><button onclick="logout()">登出</button></div></div></div>
<div id="modalBg" class="modalBg" onclick="if(event.target===this)closeModal()"><div id="modal" class="modal"></div></div><div id="imageBg" class="imageBg" onclick="closeImage()"><img id="bigImage"></div>
<script>
const API='/api';const SESSION='carDealerSalesWebSession_v7';let token='',me=null,company=null,data={cars:[],saleRequests:[]},version=0,currentPage='cars',timer=null;
const $=id=>document.getElementById(id);const money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const rate=v=>{let n=Number(v||0);return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')};
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(API+path,opt);let j={};try{j=await r.json()}catch{};if((r.status===401||r.status===403)&&token){logout(j.error||'登入或授權已失效');throw new Error(j.error||'授權失效')}if(!r.ok)throw new Error(j.error||'操作失敗');return j}
async function health(){try{let r=await fetch(API+'/health',{cache:'no-store'});if(!r.ok)throw 0;$('netState').className='notice';$('netState').textContent='🟢 中央伺服器連線正常';return true}catch{$('netState').className='notice error';$('netState').textContent='🔴 無法連線。沒有網路或伺服器離線時不能登入';return false}}
async function doLogin(){if(!(await health()))return;let b=$('loginBtn');b.disabled=true;b.textContent='登入中…';try{let j=await api('/auth/login',{method:'POST',body:JSON.stringify({companyCode:$('companyCode').value.trim(),username:$('username').value.trim(),password:$('password').value})});if(j.user?.role!=='sales')throw new Error('這個入口只允許業務帳號登入');token=j.token;me=j.user;company=j.company;data=j.snapshot||data;version=Number(j.version||0);saveSession();enter()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='登入'}}
function saveSession(){if(token)localStorage.setItem(SESSION,JSON.stringify({token,page:currentPage}))}
function enter(){$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.name+'｜業務獎金 '+rate(me.commissionRate)+'%';$('shop').textContent=company.name+'｜'+company.id;showPage(currentPage||'cars');clearInterval(timer);timer=setInterval(sync,3000)}
function logout(msg=''){clearInterval(timer);timer=null;token='';me=null;company=null;data={cars:[],saleRequests:[]};localStorage.removeItem(SESSION);$('app').classList.add('hidden');$('loginPage').classList.remove('hidden');$('password').value='';if(msg)alert(msg);health()}
async function restore(){let s;try{s=JSON.parse(localStorage.getItem(SESSION))}catch{};if(!s?.token)return false;token=s.token;currentPage=s.page||'cars';try{let j=await api('/session/restore');if(j.user?.role!=='sales')throw new Error('角色不符');me=j.user;company=j.company;data=j.snapshot||data;version=Number(j.version||0);enter();return true}catch{token='';localStorage.removeItem(SESSION);return false}}
async function sync(){if(!token)return;try{let j=await api('/company/snapshot');$('cloud').className='badge';$('cloud').textContent='☁ 已同步';company=j.company||company;if(j.user)me=j.user;if(Number(j.version||0)!==version){version=Number(j.version||0);data=j.snapshot||data;render()}}catch(e){if(token){$('cloud').className='badge off';$('cloud').textContent='🔴 離線'}}}
function showPage(p){currentPage=p;saveSession();$('tabCars').classList.toggle('active',p==='cars');$('tabReq').classList.toggle('active',p==='requests');render()}
function carPhotos(c){let p=[...(c.intakePhotos||[]),...(c.inspectionCertPhotos||[])];return p.length?`<div class="thumbs">${p.slice(0,8).map(x=>`<img src="${x}" onclick="openImage(this.src)">`).join('')}</div>`:''}
function render(){if(currentPage==='cars')renderCars();else renderRequests()}
function renderCars(){let q=($('searchCars')?.value||'').trim().toLowerCase(),cars=(data.cars||[]).filter(c=>(c.plate+' '+c.model+' '+c.year).toLowerCase().includes(q));$('page').innerHTML=`<div class="card"><h2 style="margin-top:0">目前庫存</h2><input id="searchCars" class="search" placeholder="搜尋車牌／車型／年份" value="${esc(q)}" oninput="renderCars()"></div><div class="cardsGrid">${cars.map(c=>`<div class="car"><div class="carhead"><div><div class="plate">${esc(c.plate)}</div><div>${esc(c.model)}</div></div><span class="status approved">在庫</span></div><div class="row muted"><span>${esc(c.year||'-')} 年</span><span>｜</span><span>${Number(c.mileage||0).toLocaleString()} km</span></div><div class="price">公司底價 ${money(c.floorPrice)}</div>${carPhotos(c)}<button class="btn primary full" style="margin-top:12px" onclick="openApply('${esc(c.id)}')">提交成交申請</button></div>`).join('')||'<div class="card muted">目前沒有符合條件的在庫車輛</div>'}</div>`}
function statusClass(s){return s==='待確認'?'pending':(s==='已確認'||s==='已成交'||s==='通過')?'approved':'rejected'}
function renderRequests(){let rs=[...(data.saleRequests||[])].sort((a,b)=>String(b.requestedAt||'').localeCompare(String(a.requestedAt||'')));$('page').innerHTML=`<div class="card"><h2 style="margin-top:0">我的成交申請</h2><div class="kpi"><div><div class="muted">申請數</div><div class="big">${rs.length}</div></div><div><div class="muted">待確認</div><div class="big">${rs.filter(r=>r.status==='待確認').length}</div></div></div></div>${rs.map(r=>`<div class="car"><div class="carhead"><div><div class="plate">${esc(r.plate)}</div><div>${esc(r.model)}</div></div><span class="status ${statusClass(r.status)}">${esc(r.status)}</span></div><div>成交售價：<b>${money(r.sellPrice)}</b></div><div>公司底價：${money(r.floorPrice)}</div><div>預估獎金：<b>${money(r.expectedCommission)}</b>（${rate(r.commissionRate)}%）</div><div class="muted">成交日 ${esc(r.saleDate||'-')}｜申請日 ${esc(r.requestedAt||'-')}</div>${r.rejectReason?`<div class="notice error">駁回原因：${esc(r.rejectReason)}</div>`:''}</div>`).join('')||'<div class="card muted">目前沒有成交申請</div>'}`}
function openApply(id){let c=(data.cars||[]).find(x=>String(x.id)===String(id));if(!c)return;let today=new Date().toISOString().slice(0,10);$('modal').innerHTML=`<h2>提交成交申請</h2><div class="notice">${esc(c.plate)}｜${esc(c.model)}<br>公司底價：<b>${money(c.floorPrice)}</b><br>你的獎金比例：<b>${rate(me.commissionRate)}%</b></div><div class="field"><label>成交售價</label><input id="sellPrice" type="number" inputmode="numeric" value="${Number(c.floorPrice||0)}" oninput="updateCommission('${esc(id)}')"></div><div class="field"><label>成交日期</label><input id="saleDate" type="date" value="${today}"></div><div id="commissionPreview" class="notice"></div><div class="row"><button class="btn primary" style="flex:1" onclick="submitApply('${esc(id)}')">確認送出</button><button class="btn ghost" onclick="closeModal()">取消</button></div>`;$('modalBg').classList.add('show');updateCommission(id)}
function updateCommission(id){let c=(data.cars||[]).find(x=>String(x.id)===String(id)),sell=Number($('sellPrice')?.value||0),diff=Math.max(0,sell-Number(c?.floorPrice||0)),bonus=diff*Number(me?.commissionRate||0)/100;if($('commissionPreview'))$('commissionPreview').innerHTML=`超過底價：<b>${money(diff)}</b><br>預估業務獎金：<b>${money(bonus)}</b>`}
async function submitApply(carId){let sell=Number($('sellPrice').value||0),date=$('saleDate').value;if(sell<=0||!date)return alert('請確認售價與成交日期');try{let j=await api('/sales/request',{method:'POST',body:JSON.stringify({carId,sellPrice:sell,saleDate:date})});data=j.snapshot||data;version=Number(j.version||version);closeModal();showPage('requests');alert('成交申請已送出，等待車行後台確認。')}catch(e){alert(e.message)}}
function closeModal(){$('modalBg').classList.remove('show')}function openImage(src){$('bigImage').src=src;$('imageBg').classList.add('show')}function closeImage(){$('imageBg').classList.remove('show');$('bigImage').src=''}
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});window.addEventListener('online',()=>token?sync():health());window.addEventListener('offline',()=>{$('netState').className='notice error';$('netState').textContent='🔴 目前沒有網路'});
(async()=>{await health();if(!(await restore())){};if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
