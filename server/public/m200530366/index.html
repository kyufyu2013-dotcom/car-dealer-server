<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>庫車掌盤｜Super Admin 資料中心</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f5f7fb;color:#1f2937}
button,input,select{font:inherit}button{cursor:pointer}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8eefc,#f8fafc)}
.login{width:min(430px,92vw);background:#fff;padding:30px;border-radius:18px;box-shadow:0 18px 60px #0002}
.login h1{margin:0 0 8px}.muted{color:#6b7280;font-size:13px}.login input{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #d1d5db;border-radius:9px}
.btn{border:0;border-radius:9px;padding:9px 13px;background:#111827;color:#fff}
.btn2{border:1px solid #d1d5db;border-radius:9px;padding:8px 11px;background:#fff;color:#111827}
.btn-danger{border:1px solid #fecaca;border-radius:9px;padding:8px 11px;background:#fee2e2;color:#991b1b}
#app{display:none;min-height:100vh}.layout{display:flex;min-height:100vh}
.sidebar{width:245px;background:#111827;color:#fff;padding:18px;flex-shrink:0}
.brand{font-size:20px;font-weight:700;margin-bottom:5px}.subbrand{font-size:12px;color:#9ca3af;margin-bottom:22px}
.nav button{width:100%;text-align:left;border:0;background:transparent;color:#d1d5db;padding:11px;border-radius:8px;margin:2px 0}
.nav button:hover,.nav button.active{background:#374151;color:#fff}
.content{flex:1;min-width:0;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:25px;margin:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;margin-bottom:18px}
.card,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 4px 18px #0000000b}
.card .num{font-size:27px;font-weight:700;margin-top:5px}.panel{margin-bottom:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap;font-size:14px}th{background:#f9fafb}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px}
.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{padding:9px;border:1px solid #d1d5db;border-radius:8px;min-width:150px}
.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal-bg.show{display:flex}.modal{width:min(1000px,97vw);max-height:93vh;overflow:auto;background:#fff;border-radius:15px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid label{font-weight:700;font-size:14px}.grid input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-top:5px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}
.detail-item{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:11px}.detail-item b{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}
.notice{padding:11px 13px;border-radius:9px;background:#eff6ff;border:1px solid #bfdbfe;margin-bottom:14px;line-height:1.6}
.thumb{width:110px;height:82px;object-fit:cover;border-radius:8px;border:1px solid #ddd;cursor:pointer;margin:4px}.node-live{box-shadow:0 0 0 2px #bbf7d0 inset}.node-loading{display:flex;align-items:center;gap:10px;padding:18px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;margin:14px 0}.spinner{width:18px;height:18px;border:3px solid #bfdbfe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.layout{display:block}.sidebar{width:100%}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.content{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginPage">
  <div class="login">
    <h1>🔐 Super Admin</h1>
    <p class="muted">系統總管理獨立入口。車行端不顯示這個入口。</p>
    <label>管理員帳號</label><input id="loginUser" autocomplete="username">
    <label>密碼</label><input id="loginPass" type="password" autocomplete="current-password">
    <button class="btn" style="width:100%" onclick="doLogin()">登入超級管理後台</button>
    <div class="muted" style="margin-top:10px">Super Admin 專用登入</div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">🚘 Super Admin</div>
      <div class="subbrand">全車行資料中心</div>
      <div class="nav">
        <button id="navOverview" class="active" onclick="showPage('overview')">🏢 車行總覽</button>
        <button id="navVehicles" onclick="showPage('vehicles')">🚗 全部車輛</button>
        <button id="navSales" onclick="showPage('sales')">💰 全部成交</button>
        <button id="navUsers" onclick="showPage('users')">👥 全部帳號</button>
        <button id="navHealth" onclick="showPage('health')">🩺 系統健康</button>
        <button id="navDiagnostics" onclick="showPage('diagnostics')">🧰 錯誤診斷</button>
        <button id="navUpdates" onclick="showPage('updates')">🚀 版本更新</button>
        <button id="navBackups" onclick="showPage('backups')">🛡️ 中央備份</button>
        <button id="navHa" onclick="showPage('ha')">🛰️ 容災架構</button>
        <button id="navLoadtest" onclick="showPage('loadtest')">⚙️ 壓力測試</button>
        <button id="navPerformance" onclick="showPage('performance')">📊 效能監控</button>
      </div>
    </aside>
    <main class="content">
      <div class="top">
        <div><h1 id="pageTitle">車行總覽</h1><div class="muted">最高權限：可查閱所有車行的成本、底價、成交與人員資料；帳號以 companyId + username 區分</div></div>
        <div style="display:flex;align-items:center;gap:8px"><span id="cloudState" class="badge warn">尚未連線</span><button class="btn2" onclick="refreshCloud(true)">立即同步</button><button class="btn2" onclick="logout()">登出</button></div>
      </div>
      <div id="main"></div>
    </main>
  </div>
</div>

<div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div>

<script>
const API_BASE=(localStorage.getItem("carShopApiBase")||"/api").replace(/\/$/,"");
const SUPER_SESSION_KEY="carDealerSuperCloudSession_v1";
const AUTO_REFRESH_MS=3000;
let superToken="",currentPage="overview",cloudRows=[],healthRows=[],diagnosticRows=[],globalSchema=null,updatePolicy=null,updateEventRows=[],backupData=null,haData=null,loadTestData=null,performanceData=null,refreshing=false,lastCloudAt=0,lastDiagnosticsAt=0,lastBackupsAt=0,lastHaAt=0,lastLoadTestAt=0,lastPerformanceAt=0;
const nodeCompanyCache=new Map(),nodeVehicleCache=new Map();

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(v){return "$"+Number(v||0).toLocaleString("zh-TW")}
function rate(v){const n=Number(v||0);return Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"")}
function badgeFor(st){return st==="啟用中"?"ok":st==="尚未啟用"?"warn":"bad"}
function setCloudState(text,kind="info"){const el=document.getElementById("cloudState");if(!el)return;el.className="badge "+kind;el.textContent=text}
function getSession(){try{return JSON.parse(localStorage.getItem(SUPER_SESSION_KEY)||"null")}catch{return null}}
function saveSession(){if(!superToken)return;localStorage.setItem(SUPER_SESSION_KEY,JSON.stringify({token:superToken,page:currentPage,savedAt:Date.now()}))}

async function api(path,options={}){
  const headers={"Content-Type":"application/json",...(options.headers||{})};
  if(superToken)headers.Authorization="Bearer "+superToken;
  let res;
  try{res=await fetch(API_BASE+path,{...options,headers})}
  catch(e){throw new Error("無法連線中央伺服器，請確認網路或 Render 狀態")}
  let body={};try{body=await res.json()}catch{}
  if(res.status===401&&superToken){logout("Super Admin 登入已失效，請重新登入");throw new Error(body.error||"登入已失效")}
  if(!res.ok)throw new Error(body.error||("HTTP "+res.status));
  return body;
}

function companyDataRow(id){return cloudRows.find(x=>x.company?.id===id)||null}
function allCars(){const arr=[];for(const x of cloudRows){const cars=Array.isArray(x.snapshot?.cars)?x.snapshot.cars:[];for(const car of cars)arr.push({...car,_companyId:x.company.id,_companyName:x.company.name})}return arr}
function allUsers(){const arr=[];for(const x of cloudRows){const users=Array.isArray(x.users)&&x.users.length?x.users:(Array.isArray(x.snapshot?.users)?x.snapshot.users:[]);for(const u of users)arr.push({...u,_companyId:x.company.id,_companyName:x.company.name})}return arr}
function soldCars(){return allCars().filter(c=>c.status==="已售"||Number(c.sellPrice)>0)}
function nodeIsOnline(x){if(x?.node?.capabilities?.online===false)return false;const t=Date.parse(x?.node?.last_seen_at||"");return Number.isFinite(t)&&(Date.now()-t)<45000}
function nodeStatusHtml(x){if(!x?.node)return `<span class="badge warn">尚未建立節點</span>`;return nodeIsOnline(x)?`<span class="badge ok node-live">● Node 在線</span>`:`<span class="badge bad">● Node 離線</span>`}
function fmtDateTime(v){if(!v)return "-";try{const d=new Date(v);if(!Number.isFinite(d.getTime())||d.getTime()<946684800000)return "-";return d.toLocaleString("zh-TW",{hour12:false})}catch{return "-"}}
async function requestNodeData(companyId,resource,payload={}){
 const start=await api(`/super/nodes/${encodeURIComponent(companyId)}/request`,{method:"POST",body:JSON.stringify({resource,payload})});
 const id=start.requestId,deadline=Date.now()+18000;
 while(Date.now()<deadline){
   await new Promise(r=>setTimeout(r,500));
   const r=await api(`/super/node-requests/${encodeURIComponent(id)}`);
   if(r.status==="completed")return r.result;
   if(["failed","expired"].includes(r.status))throw new Error(r.error||"Dealer Node 讀取失敗");
 }
 throw new Error("Dealer Node 回應逾時");
}
function loadingNode(title,sub="正在透過中央控制通道向車行電腦讀取本機資料…"){
 modal.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">${esc(title)}</h2><div class="muted">Dealer Node 即時讀取</div></div><button class="btn2" onclick="closeModal()">關閉</button></div><div class="node-loading"><div class="spinner"></div><div><b>正在讀取</b><div class="muted">${esc(sub)}</div></div></div>`;modalBg.classList.add("show")
}

async function doLogin(){
  const u=loginUser.value.trim(),p=loginPass.value;
  if(!u||!p){alert("請輸入 Super Admin 帳號與密碼");return}
  try{
    setLoginBusy(true);
    const health=await fetch(API_BASE+"/health");if(!health.ok)throw new Error("中央伺服器目前無法使用");
    const r=await fetch(API_BASE+"/super/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    let b={};try{b=await r.json()}catch{}
    if(!r.ok)throw new Error(b.error||"登入失敗");
    superToken=b.token;
    currentPage="overview";
    saveSession();
    loginPass.value="";
    loginPage.style.display="none";app.style.display="block";
    await refreshCloud(false);
    showPage("overview");
  }catch(e){alert(e.message)}finally{setLoginBusy(false)}
}
function setLoginBusy(v){const b=document.querySelector("#loginPage .btn");if(b){b.disabled=v;b.textContent=v?"連線登入中…":"登入超級管理後台"}}
function logout(reason=""){
  superToken="";cloudRows=[];localStorage.removeItem(SUPER_SESSION_KEY);
  app.style.display="none";loginPage.style.display="flex";loginPass.value="";setCloudState("尚未連線","warn");
  if(reason)alert(reason);
}
async function restoreSession(){
  const s=getSession();if(!s?.token)return false;
  superToken=s.token;currentPage=s.page||"overview";
  loginPage.style.display="none";app.style.display="block";
  try{await refreshCloud(false);showPage(currentPage);return true}catch(e){logout();return false}
}
loginPass.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});

function showPage(p){
  currentPage=p;saveSession();
  ["overview","vehicles","sales","users","health","diagnostics","updates","backups","ha","loadtest","performance"].forEach(x=>document.getElementById("nav"+x[0].toUpperCase()+x.slice(1)).classList.toggle("active",x===p));
  const titles={overview:"車行總覽",vehicles:"全部車輛",sales:"全部成交",users:"全部帳號",health:"系統健康",diagnostics:"錯誤診斷",updates:"版本更新",backups:"中央備份",ha:"容災架構",loadtest:"壓力測試",performance:"效能監控"};pageTitle.textContent=titles[p]||"Super Admin";
  if(p==="diagnostics"&&Date.now()-lastDiagnosticsAt>5000)refreshDiagnostics(false);else if(p==="backups"&&Date.now()-lastBackupsAt>5000)refreshBackups(false);else if(p==="ha"&&Date.now()-lastHaAt>5000)refreshHa(false);else if(p==="loadtest"&&Date.now()-lastLoadTestAt>5000)refreshLoadTests(false);else if(p==="performance"&&Date.now()-lastPerformanceAt>3000)refreshPerformance(false);else renderCurrent();
}
function renderCurrent(){if(currentPage==="overview")renderOverview();else if(currentPage==="vehicles")renderVehicles();else if(currentPage==="sales")renderSales();else if(currentPage==="users")renderUsers();else if(currentPage==="health")renderHealth();else if(currentPage==="diagnostics")renderDiagnostics();else if(currentPage==="updates")renderUpdates();else if(currentPage==="backups")renderBackups();else if(currentPage==="ha")renderHa();else if(currentPage==="loadtest")renderLoadTests();else if(currentPage==="performance")renderPerformance()}
function userIsEditing(){const a=document.activeElement;return !!(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"||a.isContentEditable))}
function modalIsOpen(){return modalBg.classList.contains("show")}

// Super Admin auto-refresh must never fight the operator's scroll position.
let superScrollInteractionUntil=0,superScrollbarDragging=false;
function markSuperScrollInteraction(ms=2200){superScrollInteractionUntil=Math.max(superScrollInteractionUntil,Date.now()+ms)}
function userIsScrolling(){return superScrollbarDragging||Date.now()<superScrollInteractionUntil}
document.addEventListener("wheel",e=>{if(app.style.display!=="none")markSuperScrollInteraction()}, {passive:true,capture:true});
document.addEventListener("touchmove",e=>{if(app.style.display!=="none")markSuperScrollInteraction()}, {passive:true,capture:true});
document.addEventListener("scroll",e=>{if(app.style.display!=="none")markSuperScrollInteraction()}, true);
document.addEventListener("pointerdown",e=>{if(e.target?.closest?.(".table-wrap")){superScrollbarDragging=true;markSuperScrollInteraction(10000)}}, true);
document.addEventListener("pointerup",()=>{if(superScrollbarDragging){superScrollbarDragging=false;markSuperScrollInteraction()}}, true);
document.addEventListener("pointercancel",()=>{superScrollbarDragging=false;markSuperScrollInteraction()}, true);

function captureSuperScrollState(){
  return {
    page:currentPage,
    x:window.scrollX||document.documentElement.scrollLeft||0,
    y:window.scrollY||document.documentElement.scrollTop||0,
    tables:Array.from(document.querySelectorAll("#main .table-wrap")).map((el,i)=>({i,left:el.scrollLeft,top:el.scrollTop}))
  };
}
function restoreSuperScrollState(s){
  if(!s||s.page!==currentPage)return;
  const restore=()=>{
    window.scrollTo(s.x,s.y);
    const tables=document.querySelectorAll("#main .table-wrap");
    for(const p of s.tables||[]){const el=tables[p.i];if(el){el.scrollLeft=p.left;el.scrollTop=p.top}}
  };
  restore();
  requestAnimationFrame(restore);
}
function renderCurrentPreservingScroll(){
  const s=captureSuperScrollState();
  renderCurrent();
  restoreSuperScrollState(s);
}

async function refreshCloud(manual=false){
  if(!superToken||refreshing)return;
  refreshing=true;
  try{
    const [r,h,u,ue]=await Promise.all([api("/super/data"),api("/super/health"),api("/super/update-policy"),api("/super/update-events?limit=300")]);cloudRows=Array.isArray(r.companies)?r.companies:[];healthRows=Array.isArray(h.health)?h.health:[];globalSchema=h.schema||null;updatePolicy=u.policy||h.updatePolicy||null;updateEventRows=Array.isArray(ue.events)?ue.events:[];lastCloudAt=Date.now();setCloudState("雲端已同步","ok");saveSession();
    if(currentPage==="diagnostics"){try{const dg=await api('/super/diagnostics?limit=300');diagnosticRows=Array.isArray(dg.events)?dg.events:[];lastDiagnosticsAt=Date.now()}catch{}}
    // Data can keep refreshing in the background, but never redraw while the user is dragging/scrolling.
    // When redraw is safe, preserve both vertical page position and each table's horizontal/vertical position.
    if(manual)renderCurrentPreservingScroll();
    else if(!modalIsOpen()&&!userIsEditing()&&!userIsScrolling())renderCurrentPreservingScroll();
  }catch(e){setCloudState("連線異常","bad");if(manual)alert(e.message);throw e}
  finally{refreshing=false}
}


async function refreshDiagnostics(manual=false){
  if(!superToken)return;
  try{
    const r=await api('/super/diagnostics?limit=300');
    diagnosticRows=Array.isArray(r.events)?r.events:[];lastDiagnosticsAt=Date.now();
    if(currentPage==='diagnostics')renderCurrentPreservingScroll();
  }catch(e){if(manual)alert(e.message||'讀取診斷資料失敗')}
}
function diagnosticBadge(sev){const s=String(sev||'error');return `<span class="badge ${s==='info'?'info':s==='warn'?'warn':'bad'}">${esc(s)}</span>`}
function renderDiagnostics(){
  const rows=[...diagnosticRows];
  const open=rows.filter(x=>!x.resolved),critical=open.filter(x=>x.severity==='critical').length,errors=open.filter(x=>x.severity==='error').length;
  main.innerHTML=`<div class="cards"><div class="card"><div class="muted">未處理診斷</div><div class="num">${open.length}</div></div><div class="card"><div class="muted">Critical</div><div class="num">${critical}</div></div><div class="card"><div class="muted">Error</div><div class="num">${errors}</div></div><div class="card"><div class="muted">最近載入</div><div class="num" style="font-size:18px">${fmtDateTime(new Date(lastDiagnosticsAt||Date.now()).toISOString())}</div></div></div>
  <div class="panel"><div class="panel-head"><div><h2 style="margin:0">🧰 錯誤診斷中心</h2><div class="muted">同類錯誤自動聚合，不洗版；可查看第一次、最後一次與累計次數。密碼、Token、Cookie 等敏感欄位不寫入診斷內容。</div></div><button class="btn2" onclick="refreshDiagnostics(true)">重新整理</button></div>
  <div class="tools" style="margin:12px 0"><input id="diagQ" placeholder="搜尋車行 / Error Code / 模組 / 訊息" oninput="filterDiagnostics()"><select id="diagSeverity" onchange="filterDiagnostics()"><option value="">全部嚴重度</option><option>critical</option><option>error</option><option>warn</option><option>info</option></select><select id="diagState" onchange="filterDiagnostics()"><option value="open">未處理</option><option value="">全部</option><option value="resolved">已處理</option></select></div>
  <div class="table-wrap"><table><thead><tr><th>最後發生</th><th>車行</th><th>Error Code</th><th>模組</th><th>等級</th><th>訊息</th><th>版本</th><th>次數</th><th>第一次</th><th>狀態</th><th>操作</th></tr></thead><tbody id="diagRows">${rows.map(d=>`<tr data-search="${esc(((d.company_name||d.company_id||'')+' '+d.error_code+' '+d.module+' '+d.message).toLowerCase())}" data-sev="${esc(d.severity||'')}" data-resolved="${d.resolved?'1':'0'}"><td>${fmtDateTime(d.last_seen_at)}</td><td>${esc(d.company_name||d.company_id||'系統')}<div class="muted"><code>${esc(d.company_id||'-')}</code></div></td><td><code>${esc(d.error_code||'-')}</code></td><td>${esc(d.module||'-')}</td><td>${diagnosticBadge(d.severity)}</td><td style="min-width:260px">${esc(d.message||'-')}</td><td>${esc(d.app_version||'-')}</td><td>${Number(d.occurrence_count||1)}</td><td>${fmtDateTime(d.first_seen_at)}</td><td>${d.resolved?'<span class="badge ok">已處理</span>':'<span class="badge bad">未處理</span>'}</td><td>${d.resolved?'-':`<button class="btn2" onclick="resolveDiagnostic('${d.id}')">標記已處理</button>`}</td></tr>`).join('')||'<tr><td colspan="11">目前沒有診斷事件</td></tr>'}</tbody></table></div></div>`;
  filterDiagnostics();
}
function showCompanyDiagnostics(id){showPage('diagnostics');setTimeout(()=>{const q=document.getElementById('diagQ');if(q){q.value=id;filterDiagnostics()}},150)}
function filterDiagnostics(){const q=(document.getElementById('diagQ')?.value||'').trim().toLowerCase(),sev=document.getElementById('diagSeverity')?.value||'',state=document.getElementById('diagState')?.value||'open';document.querySelectorAll('#diagRows tr[data-search]').forEach(r=>{const okQ=!q||r.dataset.search.includes(q),okS=!sev||r.dataset.sev===sev,okR=!state||(state==='open'?r.dataset.resolved==='0':r.dataset.resolved==='1');r.style.display=okQ&&okS&&okR?'':'none'})}
async function resolveDiagnostic(id){try{await api('/super/diagnostics/'+encodeURIComponent(id)+'/resolve',{method:'POST',body:'{}'});await refreshDiagnostics(true);await refreshCloud(false)}catch(e){alert(e.message||'更新失敗')}}

  const c=x.company,cars=Array.isArray(d?.cars)?d.cars:[],stock=cars.filter(v=>v.status!=="已售"),sold=cars.filter(v=>v.status==="已售"||Number(v.sellPrice)>0),stockCost=stock.reduce((s,v)=>s+Number(v.totalCost||v.purchasePrice||0),0),profit=sold.reduce((s,v)=>s+Number(v.companyProfit||0),0),users=Array.isArray(x.users)?x.users:[];
  modal.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">${esc(c.name)}｜最高權限資料</h2><div class="muted">${isLive?`🟢 Dealer Node 本機 SQLite 即時回傳｜${fmtDateTime(d.generatedAt)}`:`🟠 Node 離線｜中央只有營運影子資料，完整成本/來源/照片目前不可讀取`}</div></div><button class="btn2" onclick="closeModal()">關閉</button></div>
  <div class="notice">${isLive?`此畫面資料是你打開車行時才由該車行節點上傳，中央完成轉送後即清除該次暫存結果。`:`Dealer Node 目前不可用。Phase 3 起中央不再永久保存完整成本、來源、照片與利潤資料。`}</div>
  <div class="detail-grid"><div class="detail-item"><b>車行代碼 companyId</b>${esc(c.id)}</div><div class="detail-item"><b>Dealer Node</b>${nodeStatusHtml(x)}</div><div class="detail-item"><b>建立方式</b>${c.createdBy==="self"?"客戶自助註冊":"Super Admin 手動建立"}</div><div class="detail-item"><b>授權狀態</b>${esc(c.status)}</div><div class="detail-item"><b>庫存</b>${stock.length} 台</div><div class="detail-item"><b>已售</b>${sold.length} 台</div><div class="detail-item"><b>庫存總成本</b>${money(stockCost)}</div><div class="detail-item"><b>累計公司利潤</b>${money(profit)}</div><div class="detail-item"><b>帳號數</b>${users.length}</div></div>
  <h3>車輛資料 ${isLive?'<span class="badge ok">Node Live</span>':''}</h3><div class="table-wrap"><table><thead><tr><th>車牌</th><th>車型</th><th>購入價</th><th>總成本</th><th>底價</th><th>售價</th><th>來源</th><th>照片</th><th>狀態</th><th></th></tr></thead><tbody>${cars.map(v=>`<tr><td>${esc(v.plate||"")}</td><td>${esc(v.model||"")}</td><td>${money(v.purchasePrice)}</td><td>${money(v.totalCost||v.purchasePrice)}</td><td><b>${money(v.floorPrice)}</b></td><td>${v.sellPrice?money(v.sellPrice):"-"}</td><td>${esc(v.source||"-")}</td><td>${Number(v.inspectionPhotoCount??(v.inspectionCertPhotos||[]).length)+Number(v.intakePhotoCount??(v.intakePhotos||[]).length)} 張</td><td>${esc(v.status||"在庫")}</td><td><button class="btn2" onclick="openVehicle('${esc(c.id)}','${esc(v.id)}')">詳細</button></td></tr>`).join("")||`<tr><td colspan="10">無車輛資料</td></tr>`}</tbody></table></div>
  <h3>人員帳號 <span class="muted">帳號/權限由中央授權資料庫管理</span></h3><div class="table-wrap"><table><thead><tr><th>姓名</th><th>帳號</th><th>角色</th><th>佣金</th><th>底薪</th><th>狀態</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name||"")}</td><td>${esc(u.username||"")}</td><td>${u.role==="admin"?"後台":"業務"}</td><td>${u.role==="sales"?rate(u.commissionRate)+"%":"-"}</td><td>${u.role==="sales"?money(u.baseSalary||0):"-"}</td><td>${u.enabled===false?"停用":"啟用"}</td></tr>`).join("")||`<tr><td colspan="6">無帳號</td></tr>`}</tbody></table></div>`;
  modalBg.classList.add("show");
}

async function openVehicle(companyId,carId){
  const x=companyDataRow(companyId);if(!x)return;const c=x.company;
  let v=null,isLive=false;
  if(nodeIsOnline(x)){
    loadingNode(c.name+"｜讀取車輛詳細資料","只讀取你目前點開的這一台車，不傳送其他車輛照片。");
    try{const live=await requestNodeData(companyId,"vehicleDetail",{carId});v=live?.vehicle||null;if(v){nodeVehicleCache.set(companyId+":"+carId,v);isLive=true}}catch(e){alert("Dealer Node 車輛讀取失敗："+e.message+"\nNode 離線時中央只有營運影子資料。")}
  }
  if(!v){v=(x.snapshot?.cars||[]).find(y=>String(y.id)===String(carId));}
  if(!v)return alert("找不到此車輛資料");renderVehicleData(x,v,isLive);
}
function renderVehicleData(x,v,isLive){
  const c=x.company,costs=Array.isArray(v.costs)?v.costs:[],fee=Number(v.saleExtraCost||0),photoCount=Number(v.inspectionPhotoCount??(v.inspectionCertPhotos||[]).length)+Number(v.intakePhotoCount??(v.intakePhotos||[]).length);
  modal.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">${esc(v.plate||"")}｜${esc(v.model||"")}</h2><div class="muted">${esc(c.name)}｜${isLive?"🟢 Dealer Node 即時資料":"🟠 中央營運影子"}</div></div><button class="btn2" onclick="closeModal()">關閉</button></div><div class="detail-grid"><div class="detail-item"><b>購入價格</b>${money(v.purchasePrice)}</div><div class="detail-item"><b>整備後總成本</b>${money(v.totalCost||v.purchasePrice)}</div><div class="detail-item"><b>公司底價</b>${money(v.floorPrice)}</div><div class="detail-item"><b>成交售價</b>${v.sellPrice?money(v.sellPrice):"-"}</div><div class="detail-item"><b>車輛來源</b>${esc(v.source||"-")}</div><div class="detail-item"><b>來源備註</b>${esc(v.sourceNote||"-")}</div><div class="detail-item"><b>業務</b>${esc(v.salesName||"-")}</div><div class="detail-item"><b>業務佣金</b>${money(v.commissionAmount)} (${rate(v.commissionRate)}%)</div><div class="detail-item"><b>交易費用</b>${money(fee)}</div><div class="detail-item"><b>公司實際利潤</b>${v.status==="已售"?money(v.companyProfit):"-"}</div><div class="detail-item"><b>入庫日</b>${esc(v.inDate||"-")}</div><div class="detail-item"><b>售出日</b>${esc(v.outDate||"-")}</div></div><h3>整備/成本明細</h3>${costs.length?`<div class="table-wrap"><table><thead><tr><th>項目</th><th>金額</th></tr></thead><tbody>${costs.map(q=>`<tr><td>${esc(q.name||q.item||"整備費")}</td><td>${money(q.amount||q.price)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="muted">沒有整備明細</div>`}<h3>本機照片</h3>${isLive?`<div class="notice">照片共 ${photoCount} 張，目前全部仍留在車行電腦。你點哪一張，Dealer Node 才傳哪一張，不會一次把整車照片上傳。</div>${nodePhotoButtons(c.id,v.id,"inspection",Number(v.inspectionPhotoCount||0),"檢驗證照片")}${nodePhotoButtons(c.id,v.id,"intake",Number(v.intakePhotoCount||0),"入庫照片")}`:`${photoBlock("檢驗證照片",v.inspectionCertPhotos)}${photoBlock("入庫照片",v.intakePhotos)}`}`;
  modalBg.classList.add("show");
}
function nodePhotoButtons(companyId,carId,kind,count,title){
  return `<h3>${esc(title)} <span class="muted">${count} 張</span></h3><div id="nodePhotos_${kind}">${count?Array.from({length:count},(_,i)=>`<button class="btn2" id="nodePhotoBtn_${kind}_${i}" style="margin:4px" onclick="loadVehiclePhoto('${esc(companyId)}','${esc(carId)}','${kind}',${i})">📷 讀取第 ${i+1} 張</button>`).join(""):`<span class="muted">沒有照片</span>`}</div>`
}
async function loadVehiclePhoto(companyId,carId,kind,index){
 const btn=document.getElementById(`nodePhotoBtn_${kind}_${index}`);if(btn){btn.disabled=true;btn.textContent="讀取中…"}
 try{
   const r=await requestNodeData(companyId,"vehiclePhoto",{carId,kind,index});
   if(!r?.src)throw new Error("Dealer Node 沒有回傳照片");
   if(btn){const img=document.createElement("img");img.className="thumb";img.src=r.src;img.title=`Node 即時讀取 ${fmtDateTime(r.generatedAt)}`;img.onclick=()=>showImage(img.src);btn.replaceWith(img)}
 }catch(e){if(btn){btn.disabled=false;btn.textContent=`📷 重新讀取第 ${index+1} 張`}alert(e.message)}
}
function photoBlock(title,photos){photos=Array.isArray(photos)?photos:[];return `<h3>${title}</h3><div>${photos.length?photos.map(src=>`<img class="thumb" src="${src}" onclick="showImage(this.src)">`).join(""):`<span class="muted">沒有照片</span>`}</div>`}
function showImage(src){modal.innerHTML=`<div style="text-align:right"><button class="btn2" onclick="closeModal()">關閉</button></div><div style="text-align:center"><img src="${src}" style="max-width:95%;max-height:80vh;border-radius:10px"></div>`;modalBg.classList.add("show")}

function openCompany(id=""){
  const x=id?companyDataRow(id):null,c=x?.company||null,admin=x?.users?.find(u=>u.role==="admin")||null;
  modal.innerHTML=`<h2>${c?"編輯車行 / 授權":"新增車行"}</h2>${c?`<div class="notice">修改後會直接寫入中央 PostgreSQL。密碼留空代表不變。</div>`:`<div class="notice">這是 Super Admin 手動建立車行；建立後客戶可直接用車行代碼、主帳號、密碼登入。</div>`}<div class="grid"><label>車行名稱<input id="cn" value="${esc(c?.name||"")}"></label><label>車行代碼 companyId<input id="cid" ${c?"disabled":""} value="${esc(c?.id||"")}" placeholder="例如 abc_car"></label><label>負責人姓名<input id="co" value="${esc(admin?.name||"後台管理員")}"></label><label>聯絡 Email<input id="cmail" value="${esc(c?.contactEmail||"")}"></label><label>車行主帳號<input id="cu" value="${esc(c?.mainUsername||admin?.username||"")}"></label><label>主帳號密碼<input id="cp" type="password" value="" placeholder="${c?"留空＝不變":"請設定密碼"}"></label><label>啟用日<input id="cs" type="date" value="${esc(c?.startDate||today())}"></label><label>到期日<input id="ce" type="date" value="${esc(c?.expiresAt||"")}"></label><label style="display:flex;align-items:center;gap:8px;margin-top:26px"><input id="cena" style="width:auto" type="checkbox" ${c?.enabled!==false?"checked":""}> 手動啟用</label><label style="display:flex;align-items:center;gap:8px;margin-top:26px"><input id="ctrial" style="width:auto" type="checkbox" ${c?.trial?"checked":""}> 試用方案</label></div><div class="actions">${c?`<button class="btn-danger" onclick="deleteCompany('${esc(c.id)}')">刪除車行</button>`:""}<button class="btn2" onclick="closeModal()">取消</button><button class="btn" onclick="saveCompany('${esc(id)}')">儲存到雲端</button></div>`;
  modalBg.classList.add("show");
}
async function saveCompany(id){
  const payloadBase={companyName:cn.value.trim(),companyCode:cid.value.trim(),ownerName:co.value.trim(),email:cmail.value.trim(),username:cu.value.trim(),password:cp.value,startDate:cs.value,expiresAt:ce.value,enabled:cena.checked,trial:ctrial.checked};
  if(!payloadBase.companyName||!payloadBase.username||(!id&&!payloadBase.password)){alert("請完整填寫車行名稱、主帳號"+(id?"":"、密碼"));return}
  if(!id&&!/^[A-Za-z0-9_-]{3,40}$/.test(payloadBase.companyCode)){alert("車行代碼只能使用英數、底線、減號，長度 3-40");return}
  if(payloadBase.startDate&&payloadBase.expiresAt&&payloadBase.expiresAt<payloadBase.startDate){alert("到期日不能早於啟用日");return}
  try{
    if(id){await api("/super/companies/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({name:payloadBase.companyName,ownerName:payloadBase.ownerName,contactEmail:payloadBase.email,mainUsername:payloadBase.username,password:payloadBase.password,startDate:payloadBase.startDate,expiresAt:payloadBase.expiresAt,enabled:payloadBase.enabled,trial:payloadBase.trial})})}
    else{await api("/super/companies",{method:"POST",body:JSON.stringify(payloadBase)})}
    closeModal();await refreshCloud(true);
  }catch(e){alert(e.message)}
}
async function toggleCompany(id){const x=companyDataRow(id);if(!x)return;const c=x.company,next=!c.enabled;if(!confirm(`確定要${next?"啟用":"停用"}「${c.name}」？`))return;try{await api("/super/companies/"+encodeURIComponent(id)+"/license",{method:"PATCH",body:JSON.stringify({enabled:next})});await refreshCloud(true)}catch(e){alert(e.message)}}
async function deleteCompany(id){const x=companyDataRow(id);if(!x)return;const c=x.company;if(!confirm(`確定永久刪除「${c.name}」？\n\n這會刪除 PostgreSQL 內該車行帳號與雲端資料，無法復原。`))return;const typed=prompt(`再次確認：請輸入車行代碼 ${c.id}`);if(typed!==c.id){alert("車行代碼不符，已取消");return}try{await api("/super/companies/"+encodeURIComponent(id),{method:"DELETE"});closeModal();await refreshCloud(true)}catch(e){alert(e.message)}}
function closeModal(){modalBg.classList.remove("show")}
modalBg.addEventListener("click",e=>{if(e.target===modalBg)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

(async function init(){
  const ok=await restoreSession();if(!ok){loginPage.style.display="flex";app.style.display="none"}
  setInterval(()=>{if(superToken)refreshCloud(false).catch(()=>{})},AUTO_REFRESH_MS);
})();
</script>
</body>
</html>
